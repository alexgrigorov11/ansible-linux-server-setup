---
- name: Create administrative user
  ansible.builtin.user:
    name: "{{ admin_user }}"
    groups:
      - sudo
    append: true
    shell: /bin/bash
    create_home: true
    state: present

- name: Add SSH public key for administrative user
  ansible.posix.authorized_key:
    user: "{{ admin_user }}"
    state: present
    key: "{{ lookup('file', ssh_public_key_path) }}"
